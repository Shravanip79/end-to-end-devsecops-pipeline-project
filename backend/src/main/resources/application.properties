spring.application.name=task-management-system

# Dynamic Server Port
server.port=${PORT:8088}

# Dynamic MySQL Credentials with Local Fallbacks
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/task_database}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Nidhi}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.show-sql=true
# Use 'validate' or 'none' in production, keeping 'update' as fallback for local dev
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Custom property for CORS configuration
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173}