version: '3.8'

services:
  # MySQL Database Service
  db:
    image: mysql:8.0
    container_name: mysql_db
    restart: always
    environment:
      MYSQL_DATABASE: task_database
      MYSQL_ROOT_PASSWORD: Nidhi
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  # Spring Boot Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: task_backend
    restart: always
    ports:
      - "8088:8088"
    environment:
      - PORT=8088
      - DB_URL=jdbc:mysql://db:3306/task_database?useSSL=false&allowPublicKeyRetrieval=true
      - DB_USERNAME=root
      - DB_PASSWORD=Nidhi
      - DDL_AUTO=update
      - ALLOWED_ORIGINS=http://localhost:5173,http://localhost:80,http://localhost
    depends_on:
      - db

  # React Frontend
  frontend:
    build:
      context: ./task-management-system-frontend  # Change path if your react folder name differs
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=http://localhost:8088
    container_name: task_frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  mysql_data:
