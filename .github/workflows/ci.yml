name: DevSecOps CI Pipeline

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build-backend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run GitLeaks Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: |
            ${{ runner.os }}-sonar

      - name: Grant execute permission to Maven Wrapper
        run: chmod +x mvnw

      - name: Build Spring Boot Application
        run: ./mvnw clean package -DskipTests

      - name: Test SonarQube Connectivity
        run: |
          curl -v "${{ secrets.SONAR_HOST_URL }}/api/system/status"

      - name: Verify SonarQube Authentication
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          response=$(curl -s \
            -o /tmp/sonar-auth-response.txt \
            -w "%{http_code}" \
            -H "Authorization: Bearer ${SONAR_TOKEN}" \
            "${SONAR_HOST_URL}/api/authentication/validate")

          echo "HTTP status: $response"
          cat /tmp/sonar-auth-response.txt

          if [ "$response" != "200" ]; then
            echo "SonarQube authentication failed."
            exit 1
          fi

      - name: SonarQube Scan
        run: |
          ./mvnw org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -DskipTests \
            -Dsonar.projectKey=DevSecOps-pipeline \
            -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }} \
            -Dsonar.token=${{ secrets.SONAR_TOKEN }}
